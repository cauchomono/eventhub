server:
  port: 3000
  tomcat:
    connection-timeout: 5000

spring:
  application:
    name: eventhub
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  config:
    import: optional:file:.env[.properties]
logging:
  level:
    root: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){faint} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{requestId}]){magenta} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

app:
  config:
    security:
      pepper: ${API_KEY_PEPPER:}
  